[project]
name = "prometheus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gdown>=5.2.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.10.6",
    "numpy>=2.3.2",
    "pandas>=2.3.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.2",
    "sqlalchemy>=2.0.43",
    "typer>=0.17.4",
]

[tool.setuptools]
packages = ["prometheus"]

[tool.setuptools.package-data]
prometheus = ["forge_weights.json", "form_weights.json", "league_curves.json", "team_aliases.json"]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pylint>=3.3.8",
    "pytest>=8.4.2",
]
