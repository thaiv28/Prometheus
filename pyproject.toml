[project]
name = "prometheus"
version = "0.1.0"
description = "Sabermetrics for League of Legends esports: team and player metrics, forecasts and a static site"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gdown>=5.2.0",
    "jinja2>=3.1.6",
    "numpy>=2.3.2",
    "pandas>=2.3.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.2",
    "sqlalchemy>=2.0.43",
    "typer>=0.17.4",
]

[project.scripts]
prometheus = "prometheus.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["prometheus"]

[tool.setuptools.package-data]
prometheus = ["forge_weights.json", "form_weights.json", "league_curves.json", "team_aliases.json"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.16",
]
# Only scripts/research/evaluate_gol_full.py plots: uv run --group research ...
research = [
    "matplotlib>=3.10.6",
]

[tool.ruff]
line-length = 88
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["prometheus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: runs the real build steps on a DB (the committed CSV sample by default; PROMETHEUS_E2E_DB=real for db/prometheus.db)",
]
