[project]
name = "prometheus"
version = "0.1.0"
description = "Sabermetrics for League of Legends esports: team and player metrics, forecasts and a static site"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gdown>=5.2.0",
    "jinja2>=3.1.6",
    "numpy>=2.3.2",
    "pandas>=2.3.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.2",
    "sqlalchemy>=2.0.43",
    "typer>=0.17.4",
]

[project.scripts]
prometheus = "prometheus.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["prometheus"]

[tool.setuptools.package-data]
prometheus = ["forge_weights.json", "form_weights.json", "league_curves.json", "team_aliases.json"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.16",
]
# Only scripts/research/evaluate_gol_full.py plots: uv run --group research ...
research = [
    "matplotlib>=3.10.6",
]

[tool.ruff]
line-length = 88
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# pyflakes, import order and syntax errors, plus bugbear, pyupgrade, comprehensions,
# perflint and ruff's own rules. Ignored: RUF001-003 (the en dashes, minus signs and
# multiplication signs in strings and comments are deliberate), B905 (zip over
# columns known to be the same length), RUF005 and PERF401 (list concatenation and
# append loops read fine here) and UP042 (StrEnum would change how the enums print).
select = ["E9", "F", "I", "B", "UP", "C4", "PERF", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B905", "RUF005", "PERF401", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["prometheus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: runs the real build steps on a DB (the committed CSV sample by default; PROMETHEUS_E2E_DB=real for db/prometheus.db)",
    "research: tests of the finished research in scripts/research/ (tests/research/); skip with -m \"not research\"",
]
