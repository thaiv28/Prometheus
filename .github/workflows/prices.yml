name: Kalshi prices

# Between daily site builds: refresh Kalshi's prices on upcoming matches, update
# the live site's kalshi.json and predictions.json, and post the day's alert issue
# (scripts/update_prices.py). No database, no site rebuild; about a minute.
on:
  schedule:
    - cron: "17 * * * *" # hourly, off the hour (GitHub may start scheduled runs late)
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write # the daily Kalshi alert issue

concurrency:
  group: kalshi-prices
  cancel-in-progress: false

jobs:
  prices:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREDICTIONS_BACKUP: s3://${{ vars.DATA_BACKUP_BUCKET }}/prometheus/predictions/predictions.json
      BUCKET: ${{ vars.DEPLOYMENT_BUCKET }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      # The publish workflow restores the prediction log, rebuilds for several
      # minutes and saves it back; updating the log in between would be overwritten
      # or would overwrite the new calls. Skip this hour while it is queued or running.
      - name: Skip while the site is being published
        id: busy
        run: |
          n=$(gh run list --workflow publish.yml --branch main --limit 10 --json status \
                --jq '[.[] | select(.status != "completed")] | length')
          echo "busy=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "$n" -gt 0 ] && echo "A publish run is in progress; skipping this hour." || true
      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.busy.outputs.busy == 'false'
      - name: Install dependencies
        if: steps.busy.outputs.busy == 'false'
        run: uv sync --frozen --no-dev
      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.busy.outputs.busy == 'false'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2
      - name: Restore the prediction log
        if: steps.busy.outputs.busy == 'false'
        run: bash scripts/prediction_log.sh restore
      - name: Update prices and alerts
        if: steps.busy.outputs.busy == 'false'
        run: uv run python scripts/update_prices.py --log data/predictions.json --out output-prices
      # Skipped when a publish run wrote the log since the restore above: its new
      # calls win, and the next hour refreshes the prices again.
      - name: Save the prediction log
        id: save_prediction_log
        if: steps.busy.outputs.busy == 'false'
        run: bash scripts/prediction_log.sh save --if-unchanged
      # No CloudFront invalidation (an hourly one would pass the free 1,000 paths a
      # month): max-age=300 lets the edge serve the new files within 5 minutes.
      - name: Publish prices to the site
        if: steps.busy.outputs.busy == 'false' && steps.save_prediction_log.outputs.saved == 'true' && env.BUCKET != ''
        run: |
          for f in kalshi.json predictions.json; do
            aws s3 cp "output-prices/$f" "s3://$BUCKET/current/$f" --only-show-errors \
              --content-type application/json --cache-control "max-age=300"
          done
      - name: Post the Kalshi alert
        if: steps.busy.outputs.busy == 'false' && steps.save_prediction_log.outputs.saved == 'true' && hashFiles('data/kalshi_alert.json') != ''
        continue-on-error: true
        run: bash scripts/post_kalshi_alert.sh

  # The pick'em apps' LoL prop lines (scripts/collect_props.py), appended to a log in
  # the backup bucket, then priced against the last build's projections
  # (scripts/update_props.py): our calls saved until each start, and props-lines.json
  # for the live Props page. Its own job: it writes only its own files (the build
  # only reads them), so it runs even while the site is being published, and a
  # source refusing never fails the run.
  props-lines:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: prop-lines
      cancel-in-progress: false
    env:
      PROP_LINES_BACKUP: s3://${{ vars.DATA_BACKUP_BUCKET }}/prometheus/props/prop_lines.jsonl
      PROP_CALLS_BACKUP: s3://${{ vars.DATA_BACKUP_BUCKET }}/prometheus/props/prop_calls.json
      BUCKET: ${{ vars.DEPLOYMENT_BUCKET }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install dependencies
        run: uv sync --frozen --no-dev
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2
      - name: Restore the lines log
        run: bash scripts/prop_data.sh restore data/prop_lines.jsonl "$PROP_LINES_BACKUP"
      - name: Read the apps' lines
        run: uv run --no-dev python scripts/collect_props.py --log data/prop_lines.jsonl
      - name: Save the lines log
        run: bash scripts/prop_data.sh save data/prop_lines.jsonl "$PROP_LINES_BACKUP"
      - name: Restore the props calls
        run: bash scripts/prop_data.sh restore data/prop_calls.json "$PROP_CALLS_BACKUP"
      # The last build's projections, from the site bucket (no database here).
      - name: Price the lines
        run: |
          aws s3 cp "s3://$BUCKET/current/props-dist.json" data/props-dist.json --only-show-errors \
            || echo "No projections published yet."
          uv run --no-dev python scripts/update_props.py --dist data/props-dist.json --out output-props
      - name: Save the props calls
        run: bash scripts/prop_data.sh save data/prop_calls.json "$PROP_CALLS_BACKUP"
      # Same 5-minute edge cache as kalshi.json (no invalidation).
      - name: Publish the lines to the site
        if: env.BUCKET != '' && hashFiles('output-props/props-lines.json') != ''
        run: |
          aws s3 cp output-props/props-lines.json "s3://$BUCKET/current/props-lines.json" --only-show-errors \
            --content-type application/json --cache-control "max-age=300"
