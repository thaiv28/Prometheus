name: Kalshi prices

# Between daily site builds: refresh Kalshi's prices on upcoming matches, update
# the live site's kalshi.json and predictions.json, and post the day's alert issue
# (scripts/update_prices.py). No database, no site rebuild; about a minute.
on:
  schedule:
    - cron: "17 * * * *" # hourly, off the hour (GitHub may start scheduled runs late)
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write # the daily Kalshi alert issue

concurrency:
  group: kalshi-prices
  cancel-in-progress: false

jobs:
  prices:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREDICTIONS_BACKUP: s3://${{ vars.DATA_BACKUP_BUCKET }}/prometheus/predictions/predictions.json
      BUCKET: ${{ vars.DEPLOYMENT_BUCKET }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      # The publish workflow restores the prediction log, rebuilds for several
      # minutes and saves it back; updating the log in between would be overwritten
      # or would overwrite the new calls. Skip this hour while it is queued or running.
      - name: Skip while the site is being published
        id: busy
        run: |
          n=$(gh run list --workflow publish.yml --limit 10 --json status \
                --jq '[.[] | select(.status != "completed")] | length')
          echo "busy=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "$n" -gt 0 ] && echo "A publish run is in progress; skipping this hour." || true
      - uses: astral-sh/setup-uv@v6
        if: steps.busy.outputs.busy == 'false'
      - name: Install dependencies
        if: steps.busy.outputs.busy == 'false'
        run: uv sync --frozen --no-dev && uv pip install -e .
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.busy.outputs.busy == 'false'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2
      - name: Restore the prediction log
        if: steps.busy.outputs.busy == 'false'
        run: aws s3 cp "$PREDICTIONS_BACKUP" data/predictions.json --only-show-errors
      - name: Update prices and alerts
        if: steps.busy.outputs.busy == 'false'
        run: uv run python scripts/update_prices.py --log data/predictions.json --out output-prices
      - name: Save the prediction log
        if: steps.busy.outputs.busy == 'false'
        run: aws s3 cp data/predictions.json "$PREDICTIONS_BACKUP" --only-show-errors
      # No CloudFront invalidation (an hourly one would pass the free 1,000 paths a
      # month): max-age=300 lets the edge serve the new files within 5 minutes.
      - name: Publish prices to the site
        if: steps.busy.outputs.busy == 'false' && env.BUCKET != ''
        run: |
          for f in kalshi.json predictions.json; do
            aws s3 cp "output-prices/$f" "s3://$BUCKET/current/$f" --only-show-errors \
              --content-type application/json --cache-control "max-age=300"
          done
      - name: Post the Kalshi alert
        if: steps.busy.outputs.busy == 'false' && hashFiles('data/kalshi_alert.json') != ''
        continue-on-error: true
        run: bash scripts/post_kalshi_alert.sh
