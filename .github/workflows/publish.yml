name: Publish

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 10 * * *" # daily at 3am PDT, after Oracle's Elixir updates
  workflow_dispatch:
    inputs:
      full_upload:
        description: "Upload every file, ignoring the deploy manifest"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  issues: write # the daily Kalshi alert issue

# One group per ref (a PR's is refs/pull/<n>/merge), so PR runs never wait on or
# cancel a main publish. A new push to a PR cancels its older run; main runs queue.
concurrency:
  group: deploy-prometheus-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint and the test suite need no data (e2e builds a small DB from a committed
  # CSV sample). They run alongside the build; deploy waits for both.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --frozen && uv pip install -e .
      - name: Format
        run: uv run ruff format --check
      - name: Lint
        run: uv run ruff check
      - name: Test
        run: uv run pytest -q

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAN_USE_AWS: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      DATA_BACKUP: s3://${{ vars.DATA_BACKUP_BUCKET }}/prometheus/oracles-elixir/
      PREDICTIONS_BACKUP: s3://${{ vars.DATA_BACKUP_BUCKET }}/prometheus/predictions/predictions.json
      MARKET_PRICES_BACKUP: s3://${{ vars.DATA_BACKUP_BUCKET }}/prometheus/markets/market_prices.json
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --frozen && uv pip install -e .
      # Oracle's Elixir updates its CSVs once a day, before the 10:00 UTC cron, and
      # Google Drive refuses them when they've been downloaded too often ("Too many
      # users"). So they're downloaded at most once per data day (10:00 UTC to
      # 10:00 UTC), on main, and cached as oracles-elixir-day-<day>; every other
      # run restores the newest entry and skips Drive. A failed download saves
      # nothing, so the next main run tries again, building from the cache meanwhile.
      - name: Data day
        id: day
        run: echo "day=$(date -u -d '10 hours ago' +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore cached CSVs
        id: raw-cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: oracles-elixir-day-${{ steps.day.outputs.day }}
          restore-keys: oracles-elixir-
      # On main, the platform artifacts bucket holds the last good CSVs as a
      # fallback (PR builds can't assume the AWS role, so they rely on the cache).
      - name: AWS credentials for the data backup
        if: env.CAN_USE_AWS == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2
      - name: Restore CSVs from backup when the cache is empty
        if: env.CAN_USE_AWS == 'true'
        run: |
          if compgen -G "data/raw/*.csv" > /dev/null; then exit 0; fi
          mkdir -p data/raw
          aws s3 cp "$DATA_BACKUP" data/raw/ --recursive --only-show-errors
          gunzip -f data/raw/*.csv.gz
      # Download only on main when today's CSVs aren't cached yet (PRs never do:
      # they can't save to main's cache, and every download counts against Drive).
      - name: Build database
        env:
          REFRESH_DATA: ${{ env.CAN_USE_AWS == 'true' && steps.raw-cache.outputs.cache-hit != 'true' && '1' || '0' }}
        run: uv run bash scripts/setup_db.sh
      - name: Back up freshly downloaded CSVs
        if: env.CAN_USE_AWS == 'true' && hashFiles('data/.fresh-download') != ''
        run: |
          mkdir -p "$RUNNER_TEMP/backup"
          for f in data/raw/*.csv; do gzip -n -c "$f" > "$RUNNER_TEMP/backup/$(basename "$f").gz"; done
          aws s3 sync "$RUNNER_TEMP/backup" "$DATA_BACKUP" --size-only --only-show-errors
      # Main only, after a successful download (about 225 MB an entry, one per day;
      # unused entries expire after a week). PRs read main's.
      - name: Save CSVs to the cache
        if: env.CAN_USE_AWS == 'true' && hashFiles('data/.fresh-download') != ''
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: oracles-elixir-day-${{ steps.day.outputs.day }}
      # The e2e tests again, on today's full DB.
      - name: Test on the full DB
        env:
          PROMETHEUS_E2E_DB: real
        run: uv run pytest -q -m e2e
      # Refit the FORGE weights on today's data; warns (does not fail) on a big move.
      - name: Check FORGE weights
        run: uv run python scripts/evaluate_metrics.py --check-weights
      # The prediction log (every call saved before its match, and the results) lives
      # in the backup bucket; a build without it (PRs, first run) starts a new one
      # with a 30-day reconstructed backfill.
      - name: Restore the prediction log
        if: env.CAN_USE_AWS == 'true'
        run: aws s3 cp "$PREDICTIONS_BACKUP" data/predictions.json --only-show-errors || echo "No saved prediction log yet."
      # Kalshi's last price before each past series, for the game logs on team and
      # player pages (scripts/export_market_prices.py, uploaded by hand). Without it
      # the logs show only the prices saved in the prediction log.
      - name: Restore Kalshi prices
        if: env.CAN_USE_AWS == 'true'
        run: aws s3 cp "$MARKET_PRICES_BACKUP" data/market_prices.json --only-show-errors || echo "No saved Kalshi prices."
      - name: Build static site
        env:
          # Optional bot password (Special:BotPasswords) for a higher Leaguepedia rate limit.
          LEAGUEPEDIA_USER: ${{ secrets.LEAGUEPEDIA_USER }}
          LEAGUEPEDIA_PASSWORD: ${{ secrets.LEAGUEPEDIA_PASSWORD }}
        run: uv run python scripts/build_site.py
      - name: Save the prediction log
        if: env.CAN_USE_AWS == 'true' && hashFiles('data/predictions.json') != ''
        run: aws s3 cp data/predictions.json "$PREDICTIONS_BACKUP" --only-show-errors
      # The build writes data/kalshi_alert.json when FORGE beats Kalshi's ask by 5+
      # points on a match 6-36 hours out (prometheus/alerts.py); post it as the day's
      # issue (scripts/post_kalshi_alert.sh). The hourly prices workflow does the same
      # between builds. Never blocks the deploy.
      - name: Post the Kalshi alert
        if: env.CAN_USE_AWS == 'true' && hashFiles('data/kalshi_alert.json') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/post_kalshi_alert.sh
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: output
          if-no-files-found: error
          retention-days: 7

  # Kalshi's settled markets and candlesticks for the PR benchmark check's market
  # comparison (benchmarks.yml): fetch what's new (scripts/evaluate_markets.py
  # --update-cache; no DB) and save an Actions cache entry PRs restore. Off the
  # deploy path. The first run fills an empty cache (about 4,900 requests, ~45 min);
  # progress is saved even if it times out, and the next run continues.
  kalshi-cache:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --frozen --no-dev && uv pip install -e .
      - name: Restore the Kalshi cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: data/markets
          key: kalshi-markets-${{ github.run_id }}
          restore-keys: kalshi-markets-
      - name: Fetch new settled markets
        id: fetch
        continue-on-error: true
        timeout-minutes: 70
        run: uv run python scripts/evaluate_markets.py --update-cache
      - name: Cache key
        id: key
        if: always()
        run: |
          if compgen -G "data/markets/*.json" > /dev/null; then
            echo "key=kalshi-markets-$(cat data/markets/*.json data/markets/candles/*.json 2>/dev/null | sha256sum | cut -c1-40)" >> "$GITHUB_OUTPUT"
          fi
      - name: Save the Kalshi cache
        if: always() && steps.key.outputs.key != '' && steps.key.outputs.key != steps.restore.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: data/markets
          key: ${{ steps.key.outputs.key }}
      - name: Fail if the fetch failed
        if: steps.fetch.outcome == 'failure'
        run: exit 1

  # Mirrors thaiv28/project-platform-workflows deploy-static.yml, which builds with npm.
  deploy:
    needs: [check, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOYMENT_BUCKET != '' && vars.CLOUDFRONT_DISTRIBUTION_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUCKET: ${{ vars.DEPLOYMENT_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      HEALTH_URL: https://prometheus.thaiv.dev/
    steps:
      # Only the deploy script; the site itself comes from the build's artifact.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/deploy_site.py
          sparse-checkout-cone-mode: false
          path: repo
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: output
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2
      # Only files whose content hash changed since the last deploy go up, straight
      # into current/ (scripts/deploy_site.py; the manifest is deploy/manifest.json).
      # kalshi.json and predictions.json always go up with a 5-minute Cache-Control,
      # because the hourly prices job rewrites them without invalidating.
      - name: Upload changed files
        env:
          FULL: ${{ inputs.full_upload && '--full' || '' }}
        run: python3 repo/scripts/deploy_site.py --output output $FULL
      - name: Invalidate edge cache
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
      - name: Check deployment health
        run: curl --fail --retry 6 --retry-delay 10 --retry-all-errors "$HEALTH_URL"
      - name: Record deployment result
        if: always()
        run: |
          echo "## prometheus" >> "$GITHUB_STEP_SUMMARY"
          echo "- revision: \`${{ github.sha }}\` (run ${{ github.run_id }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- result: \`${{ job.status }}\`" >> "$GITHUB_STEP_SUMMARY"
