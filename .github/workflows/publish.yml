name: Publish

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 10 * * *" # daily at 3am PDT, after Oracle's Elixir updates
  workflow_dispatch:
    inputs:
      full_upload:
        description: "Upload every file, ignoring the deploy manifest"
        type: boolean
        default: false

      deploy_execution:
        description: "Redeploy the current executor (mode and limits stay unchanged)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

# One group per ref (a PR's is refs/pull/<n>/merge), so PR runs never wait on or
# cancel a main publish. A new push to a PR cancels its older run; main runs queue.
concurrency:
  group: deploy-prometheus-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint and the test suite need no data (e2e builds a small DB from a committed
  # CSV sample). They run alongside the build; deploy waits for both.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install dependencies
        run: uv sync --frozen
      - name: Format
        run: uv run ruff format --check
      - name: Lint
        run: uv run ruff check
      - name: Test
        run: uv run pytest -q
      - name: Execution signing tests when changed
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if ! git diff --quiet HEAD^1 HEAD -- prometheus/execution/ deploy/execution/ 'tests/test_execution*'; then
            uv run --with cryptography==50.0.2 pytest -q tests/test_execution_api.py -k official_request_signature
          fi

  # A PR that touches only docs and Markdown can't change the site's data or
  # code, so it skips the build (check still runs). Every other event builds.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.diff.outputs.build }}
      execution: ${{ steps.diff.outputs.execution }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Changed files
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          echo "execution=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = push ]; then
            if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              git ls-tree -r --name-only HEAD > "$RUNNER_TEMP/changed-files"
            else
              git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
              git diff --name-only "$BEFORE_SHA" HEAD > "$RUNNER_TEMP/changed-files"
            fi
            if grep -qE '^(prometheus/(__init__\.py|alert_contract\.py|market_blend\.(py|json)|live_map\.py|live_map_blend\.json|live/(draft\.py|feed\.py|timeline\.py|time_model[^/]*\.json|__init__\.py)|markets\.py|execution/)|deploy/execution/|.github/workflows/publish\.yml$)' "$RUNNER_TEMP/changed-files"; then
              echo "execution=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          if [ "${{ github.event_name }}" != pull_request ] \
              || git diff --name-only HEAD^1 HEAD | grep -qvE '^(docs/|[^/]+\.md$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs changed; skipping the build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-execution:
    needs: [check, changes]
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'push' && needs.changes.outputs.execution == 'true') || (github.event_name == 'workflow_dispatch' && inputs.deploy_execution))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Refuse an obsolete release
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Build isolated runtime
        run: bash deploy/execution/package.sh "$RUNNER_TEMP/execution.zip"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.KALSHI_EXECUTION_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2
          role-session-name: kalshi-execution-deploy-${{ github.run_id }}
          mask-aws-account-id: true
          unset-current-credentials: true
      - name: Release and verify Lambda
        run: uv run --no-project --with boto3 python -m deploy.execution.deploy --package "$RUNNER_TEMP/execution.zip"

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAN_USE_AWS: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      DATA_BACKUP: s3://${{ vars.DATA_BACKUP_BUCKET }}/prometheus/oracles-elixir/
      PREDICTIONS_BACKUP: s3://${{ vars.DATA_BACKUP_BUCKET }}/prometheus/predictions/predictions.json
      PROP_LINES_BACKUP: s3://${{ vars.DATA_BACKUP_BUCKET }}/prometheus/props/prop_lines.jsonl
      PROP_CALLS_BACKUP: s3://${{ vars.DATA_BACKUP_BUCKET }}/prometheus/props/prop_calls.json
      MARKET_PRICES_BACKUP: s3://${{ vars.DATA_BACKUP_BUCKET }}/prometheus/markets/market_prices.json
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install dependencies
        run: uv sync --frozen
      # Oracle's Elixir updates its CSVs once a day, before the 10:00 UTC cron, and
      # Google Drive refuses them when they've been downloaded too often ("Too many
      # users"). So they're downloaded at most once per data day (10:00 UTC to
      # 10:00 UTC), on main, and cached as oracles-elixir-day-<day>; every other
      # run restores the newest entry and skips Drive. A failed download saves
      # nothing, so the next main run tries again, building from the cache meanwhile.
      - name: Data day
        id: day
        run: |
          echo "day=$(date -u -d '10 hours ago' +%F)" >> "$GITHUB_OUTPUT"
          echo "weekday=$(date -u -d '10 hours ago' +%u)" >> "$GITHUB_OUTPUT"
      - name: Restore cached CSVs
        id: raw-cache
        uses: actions/cache/restore@v6
        with:
          path: data/raw
          key: oracles-elixir-day-${{ steps.day.outputs.day }}
          restore-keys: oracles-elixir-
      # On main, the platform artifacts bucket holds the last good CSVs as a
      # fallback (PR builds can't assume the AWS role, so they rely on the cache).
      - name: AWS credentials for the data backup
        if: env.CAN_USE_AWS == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2
      - name: Restore CSVs from backup when the cache is empty
        if: env.CAN_USE_AWS == 'true'
        run: |
          if compgen -G "data/raw/*.csv" > /dev/null; then exit 0; fi
          mkdir -p data/raw
          aws s3 cp "$DATA_BACKUP" data/raw/ --recursive --only-show-errors
          gunzip -f data/raw/*.csv.gz
      # Download only on main when today's CSVs aren't cached yet (PRs never do:
      # they can't save to main's cache, and every download counts against Drive):
      # the current year's file (scripts/download_data.py), and every year's on
      # Mondays in case Oracle's Elixir corrected an older one.
      - name: Download CSVs
        env:
          REFRESH_DATA: ${{ env.CAN_USE_AWS == 'true' && steps.raw-cache.outputs.cache-hit != 'true' && (steps.day.outputs.weekday == '1' && 'full' || '1') || '0' }}
        run: uv run bash scripts/setup_db.sh --download-only
      # The DB depends only on the CSVs, the build scripts and the package (not
      # the site code), so a run with the same inputs restores it instead of the
      # ~1.5-minute rebuild. Exact key, no fallback; benchmarks.yml uses the same.
      - name: Restore the cached database
        id: db-cache
        uses: actions/cache/restore@v6
        with:
          path: db/prometheus.db
          key: prometheus-db-${{ hashFiles('data/raw/*.csv', 'scripts/setup_db.sh', 'scripts/0*', 'prometheus/**', '!prometheus/site/**', 'uv.lock') }}
      - name: Build database
        if: steps.db-cache.outputs.cache-hit != 'true'
        run: uv run bash scripts/setup_db.sh
      # Main only (PRs restore main's entries); saved before anything else reads it.
      - name: Save the database to the cache
        if: env.CAN_USE_AWS == 'true' && steps.db-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: db/prometheus.db
          key: ${{ steps.db-cache.outputs.cache-primary-key }}
      # The live worker (deploy/live/refresh.sh) rates teams for FORGE and the
      # in-game model from this file, so it never loads the DB; main only.
      - name: Publish ratings for the live worker
        if: env.CAN_USE_AWS == 'true'
        run: |
          uv run python scripts/export_live_inputs.py --out "$RUNNER_TEMP/live_inputs.json"
          aws s3 cp "$RUNNER_TEMP/live_inputs.json" "s3://${{ vars.DATA_BACKUP_BUCKET }}/prometheus/live-inputs/live_inputs.json" --only-show-errors
          uv run python scripts/export_elo_state.py --out "$RUNNER_TEMP/elo_state.json.gz"
          aws s3 cp "$RUNNER_TEMP/elo_state.json.gz" "s3://${{ vars.DATA_BACKUP_BUCKET }}/prometheus/live-inputs/elo_state.json.gz" --only-show-errors
      - name: Back up freshly downloaded CSVs
        if: env.CAN_USE_AWS == 'true' && hashFiles('data/.fresh-download') != ''
        run: |
          mkdir -p "$RUNNER_TEMP/backup"
          for f in data/raw/*.csv; do gzip -n -c "$f" > "$RUNNER_TEMP/backup/$(basename "$f").gz"; done
          aws s3 sync "$RUNNER_TEMP/backup" "$DATA_BACKUP" --size-only --only-show-errors
      # Main only, after a successful download (about 225 MB an entry, one per day;
      # unused entries expire after a week). PRs read main's.
      - name: Save CSVs to the cache
        if: env.CAN_USE_AWS == 'true' && hashFiles('data/.fresh-download') != ''
        uses: actions/cache/save@v6
        with:
          path: data/raw
          key: oracles-elixir-day-${{ steps.day.outputs.day }}
      - name: Restore game feeds
        if: env.CAN_USE_AWS == 'true'
        env:
          DATA_BACKUP_BUCKET: ${{ vars.DATA_BACKUP_BUCKET }}
        run: bash scripts/game_feeds.sh restore
      # The prediction log (every call saved before its match, and the results) lives
      # in the backup bucket; a build without it (PRs, first run) starts a new one
      # with a 30-day reconstructed backfill. Any S3 error other than a missing file
      # fails the build, so a hiccup can't replace the log (scripts/prediction_log.sh).
      - name: Restore the prediction log
        if: env.CAN_USE_AWS == 'true'
        run: bash scripts/prediction_log.sh restore
      # One-time recovery of the original notification's exact terms from the
      # versioned backup; a no-op after its audit is saved with the log.
      - name: Restore the original legacy alert
        if: env.CAN_USE_AWS == 'true'
        run: uv run python scripts/oneoff/restore_alert_history.py --backup "$PREDICTIONS_BACKUP" --apply
      # The pick'em lines log and our saved calls on those lines, for the Props page
      # (scripts/prop_data.sh). Both are written only by the hourly prices workflow;
      # the build reads them.
      - name: Restore the props data
        if: env.CAN_USE_AWS == 'true'
        run: |
          bash scripts/prop_data.sh restore data/prop_lines.jsonl "$PROP_LINES_BACKUP"
          bash scripts/prop_data.sh restore data/prop_calls.json "$PROP_CALLS_BACKUP"
      # Kalshi's last price before each past series, for the game logs on team and
      # player pages (scripts/export_market_prices.py, uploaded by hand). Without it
      # the logs show only the prices saved in the prediction log.
      - name: Restore Kalshi prices
        if: env.CAN_USE_AWS == 'true'
        run: aws s3 cp "$MARKET_PRICES_BACKUP" data/market_prices.json --only-show-errors || echo "No saved Kalshi prices."
      # The live worker's finished maps, cut to a few KB each, for the live results
      # pages (scripts/live_archive.sh: compacts each new map once, then restores
      # the compact copies; under a second once they exist). Never fails the build.
      - name: Restore live results
        if: env.CAN_USE_AWS == 'true'
        env:
          LIVE_BACKUP: s3://${{ vars.DATA_BACKUP_BUCKET }}/prometheus/live
        run: bash scripts/live_archive.sh
      # Two read-only checks run alongside the site build (they only read the DB):
      # the e2e tests again on today's full DB, and a refit of the FORGE weights on
      # today's data, which warns (does not fail) on a big move. The step fails if
      # any of the three does.
      - name: Build static site and check the full DB
        env:
          # Optional bot password (Special:BotPasswords) for a higher Leaguepedia rate limit.
          LEAGUEPEDIA_USER: ${{ secrets.LEAGUEPEDIA_USER }}
          LEAGUEPEDIA_PASSWORD: ${{ secrets.LEAGUEPEDIA_PASSWORD }}
        run: |
          PROMETHEUS_E2E_DB=real uv run pytest -q -m e2e > "$RUNNER_TEMP/e2e.log" 2>&1 &
          e2e=$!
          uv run python scripts/evaluate_metrics.py --check-weights > "$RUNNER_TEMP/weights.log" 2>&1 &
          weights=$!
          status=0
          uv run python scripts/build_site.py || status=1
          wait "$e2e" || { status=1; echo "::error::e2e tests on the full DB failed"; }
          wait "$weights" || { status=1; echo "::error::FORGE weight check failed"; }
          for log in e2e weights; do
            echo "::group::$log"; cat "$RUNNER_TEMP/$log.log"; echo "::endgroup::"
          done
          exit $status
      - name: Save the prediction log
        if: env.CAN_USE_AWS == 'true' && hashFiles('data/predictions.json') != ''
        run: bash scripts/prediction_log.sh save
      # Only deploy reads it, and deploy never runs on PRs.
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: site
          path: output
          if-no-files-found: error
          retention-days: 7

  # Mirrors thaiv28/project-platform-workflows deploy-static.yml, which builds with npm.
  deploy:
    needs: [check, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOYMENT_BUCKET != '' && vars.CLOUDFRONT_DISTRIBUTION_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUCKET: ${{ vars.DEPLOYMENT_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      HEALTH_URL: https://prometheus.thaiv.dev/
    steps:
      # Only the deploy script; the site itself comes from the build's artifact.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/deploy_site.py
          sparse-checkout-cone-mode: false
          path: repo
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: output
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2
      # Only files whose content hash changed since the last deploy go up, straight
      # into current/ (scripts/deploy_site.py; the manifest is deploy/manifest.json).
      # kalshi.json and predictions.json always go up with a 5-minute Cache-Control,
      # because the hourly prices job rewrites them without invalidating.
      - name: Upload changed files
        env:
          FULL: ${{ inputs.full_upload && '--full' || '' }}
        run: python3 repo/scripts/deploy_site.py --output output $FULL
      - name: Invalidate edge cache
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
      - name: Check deployment health
        run: curl --fail --retry 6 --retry-delay 10 --retry-all-errors "$HEALTH_URL"
      - name: Record deployment result
        if: always()
        run: |
          echo "## prometheus" >> "$GITHUB_STEP_SUMMARY"
          echo "- revision: \`${{ github.sha }}\` (run ${{ github.run_id }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- result: \`${{ job.status }}\`" >> "$GITHUB_STEP_SUMMARY"
